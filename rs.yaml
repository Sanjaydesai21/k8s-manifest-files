apiVersion: apps/v1
kind: ReplicaSet 
metadata:
  name: rs-pod
  labels: 
    env: rs-label
  namespace: ns-manifest
spec:
  replicas: 2
  selector:
    matchLabels:
      env: rs-label
  template:
    metadata:
      name: rs-template
      labels:
        env: rs-label
    spec:
      containers:
      - name: httpd-cont
        image: httpd:latest
        ports: 
        - name: rs-port
          containerPort: 80
...
---
apiVersion: v1
kind: Service
metadata: 
  name: rs-svc
  labels: 
    env: rs-label
  namespace: ns-manifest
spec:
  type: LoadBalancer
  selector: 
    env: rs-label
  ports:
  - name: rs-svc-port
    protocol: TCP 
    port: 80
    targetPort: 80
