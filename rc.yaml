apiVersion: v1
kind: ReplicationController
metadata: 
  name: my-rc
  namespace: practice-ns
  labels:
    app: rc-app
spec:
  replicas: 2
  selector: 
    app: rc-app
  template: 
    metadata:
      name: rc-template
      labels:
        app: rc-app
    spec: 
      containers:
      - name: nginx-rc-container
        image: nginx:latest
        ports:
        - name: rc-port
          containerPort: 80
...
---
apiVersion: v1
kind: Service
metadata:
  name: rc-svc
  namespace: practice-ns
  labels:
    app: rc-app
spec: 
  type: NodePort
  selector:
    app: rc-app
  ports: 
  - name: rc-svc-port
    protocol: TCP 
    port: 80
    targetPort: 80