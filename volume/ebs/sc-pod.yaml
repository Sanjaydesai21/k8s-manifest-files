apiVersion: v1
kind: Pod
metadata: 
  name: sc-pod
  labels:
    type: storage 
spec: 
  containers:
  - name: nginx-cont
    image: nginx:latest
    volumeMounts:
    - name: my-vol
      mountPath: /usr/share/nginx/html/
  volumes:
  - name: my-vol
    persistentVolumeClaim:
      claimName: sc-pvc